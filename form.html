<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IkusasaLentsha | Member Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f7fc;
}

/* Hero */
.hero{
    background:linear-gradient(135deg,#0B1F4D,#153E90);
    color:white;
    text-align:center;
    padding:70px 20px;
}

.hero h1{
    font-size:40px;
    margin-bottom:15px;
}

.hero p{
    max-width:750px;
    margin:auto;
    opacity:.9;
    line-height:1.7;
}

/* Form Section */

.form-section{
    margin-top:-60px;
    padding:0 20px 80px;
}

.form-card{
    background:white;
    max-width:1100px;
    margin:auto;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.15);
}

.form-header{
    background:#F58220;
    color:white;
    padding:25px;
}

.form-header h2{
    margin-bottom:8px;
}

.form-body{
    padding:20px;
}

iframe{
    width:100%;
    height:2100px;
    border:none;
}

/* Footer */

.footer{
    background:#0B1F4D;
    color:white;
    text-align:center;
    padding:30px;
    margin-top:60px;
}

@media(max-width:768px){

.hero h1{
    font-size:30px;
}

.form-header{
    text-align:center;
}

iframe{
    height:2400px;
}

}
</style>

</head>
<body>

<section class="hero">

<h1>Member Information Form</h1>

<p>
Please complete the form below to help IkusasaLentsha maintain an
accurate database of all members. All information will be treated
confidentially.
</p>

</section>

<section class="form-section">

<div class="form-card">

<div class="form-header">

<h2>Registration Form</h2>

<p>Fields marked with * are required.</p>

</div>

<div class="form-body">

<iframe
src="https://docs.google.com/forms/d/e/1FAIpQLSfMmUSU2-nYARQVUMXLbuOh8Dbf1UgejeeKimoC5tKJiwxeDg/viewform?embedded=true">
Loading…
</iframe>

</div>

</div>

</section>

<footer class="footer">

© 2026 IkusasaLentsha. All Rights Reserved.

</footer>

</body>
</html>
